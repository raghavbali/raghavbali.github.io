<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.name }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
    <style>
        .nav-breadcrumbs-symbol {
            color: var(--accent-red) !important;
            font-weight: 700 !important;
            font-size: 1.1rem;
            transition: opacity 0.2s;
        }
        .nav-breadcrumbs-symbol:hover {
            opacity: 0.8;
            text-decoration: none !important;
        }
    </style>
    <meta name="color-scheme" content="light dark">
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark-theme');
            } else {
                var hour = new Date().getHours();
                var isNight = hour >= 19 || hour < 7;
                var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (isNight || systemDark) {
                    document.documentElement.classList.add('dark-theme');
                }
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header class="masthead">
            <h3 class="masthead-title">
                <a href="{{ '/' | relative_url }}" title="Home">{{ site.name }}</a>
            </h3>
            <div class="masthead-right">
                <nav class="nav">
                    <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
                    <a href="{{ '/published-works' | relative_url }}" class="nav-link {% if page.url contains '/published-works' %}active{% endif %}">Published Works</a>
                    <a href="{{ '/talks' | relative_url }}" class="nav-link {% if page.url contains '/talks' %}active{% endif %}">Talks</a>
                    <a href="{{ '/blog' | relative_url }}" class="nav-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a>
                    <a href="{{ '/bookshelf' | relative_url }}" class="nav-link {% if page.url contains '/bookshelf' %}active{% endif %}">BookShelf</a>
                    <a href="{{ '/about' | relative_url }}" class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a>
                    <a href="{{ '/breadcrumbs' | relative_url }}" class="nav-breadcrumbs-symbol {% if page.url contains '/breadcrumbs' %}active{% endif %}" title="Breadcrumbs">/</a>
                </nav>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
                    <i class="bi bi-moon-stars"></i>
                </button>
            </div>
        </header>

        <main class="page-content">
            {{ content }}
        </main>

        <footer class="footer">
            <small>&copy; {{ site.time | date: '%Y' }} Raghav Bali. All rights reserved. Inspired by <a href="https://markdotto.com/" target="_blank">@mdo</a>.</small>
        </footer>
    </div>
    <a href="#" id="back-to-top" title="Back to top"><i class="bi bi-arrow-up"></i></a>
    <script src="{{ '/js/theme.js' | relative_url }}"></script>
    <script src="{{ '/js/back-to-top.js' | relative_url }}"></script>
</body>
</html>
