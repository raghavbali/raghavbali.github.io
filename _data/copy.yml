home-introduction:
  eyebrow: Principal Data Scientist · Delivery Hero · Berlin
  headline: I build and improve production ML systems.
  intro: My work spans machine learning and AI, with a current focus on recommendation, personalization, and LLMs.
    I help turn model ideas into systems teams can ship and improve.
