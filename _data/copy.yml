about-introduction:
- tag: p
  text: About & experience
- tag: h1
  text: Curious about the model. Attentive to the whole system.
- tag: p
  text: I'm Raghav, a Principal Data Scientist at Delivery Hero, based in Berlin. I build production ML and AI systems,
    with a current focus on recommendation, personalization, and LLMs.
- tag: p
  text: Before Delivery Hero, I worked on ML and AI for the US healthcare sector at Optum. At Intel, I applied NLP,
    deep learning, and statistical methods to IT initiatives; at American Express, I worked on customer retention
    and digital engagement.
- tag: p
  text: I’m the author of seven well-received books, a co-inventor on 10+ US patents, and a co-author of several
    papers published at leading peer-reviewed conferences.
about-approach:
- tag: h2
  text: How I approach ML systems
- tag: p
  text: 'I approach ML systems from first principles: questioning assumptions about the data, features, and how
    the system is built and operated. Looking across the pipeline often reveals overlooked opportunities to simplify
    the work, reduce unnecessary computation, and make collaboration easier.'
- tag: p
  text: These improvements can seem obvious in retrospect, but finding them starts with examining what has become
    routine.
- tag: h3
  text: What I own
- tag: li
  text: Technical direction and architecture decisions.
- tag: li
  text: End-to-end model development and production delivery.
- tag: li
  text: Mentoring and guiding work across teams.
about-personal:
- tag: h2
  text: Beyond work
- tag: p
  text: I write books, share what I learn through talks and workshops, and build things for everyday life. I also
