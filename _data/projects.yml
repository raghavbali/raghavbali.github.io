- id: nestly
  name: Nestly
  wordmark: Nestly
  category: Hardware + software
  title: A baby monitor, built at home.
  summary: A camera, a Raspberry Pi, and a dashboard for monitoring from another device.
  detail_category: Hardware & software
  intro: A baby monitor I built at home, from the monitoring software to the dashboard.
  github_url: ''
  sections:
  - title: Why I built it
    content: I wanted a practical way to monitor the baby from another device, and a project I could build and adapt
      myself.
  - title: How it fits together
    content: The camera supplies the feed, a Raspberry Pi runs Nestly, and a phone or laptop opens the monitoring
      dashboard.
  - title: What interests me
    content: Connecting hardware and software is only part of the work. The dashboard also needs to be easy to read
      and straightforward to use in everyday life.
  - title: Build notes
    notes:
    - title: Getting the camera and monitoring server working together.
      summary: Camera setup, the Raspberry Pi, and the first working feed.
    - title: Making the dashboard easier to use.
      summary: Phone viewing, notifications, and practical controls.
  home_summary: Bringing a camera, Raspberry Pi, and a simple monitoring dashboard together.
- id: pibot
  name: PiBot
  wordmark: PiBot_
  category: Personal tools
  title: Capture first. Organize later.
  summary: My take on a personal assistant powered by self-hosted LLMs through Ollama and the pi.dev harness.
  detail_category: Capture & personal tools
  intro: My take on a personal assistant using self-hosted LLMs through Ollama and the pi.dev harness, starting
    with ideas, notes, and things I want to come back to.
  github_url: ''
  sections:
  - title: Why I'm building it
    content: An idea shouldn't need a category, date, or perfectly organized destination before it can be saved.
  - title: The approach
    content: Capture first, process later. Keep the capture step simple and make room to organize and connect the
      material afterwards. I use Ollama to run the models and the pi.dev harness to build the assistant around them.
  - title: Build notes
    notes:
    - title: Starting with a simple capture workflow.
      summary: Getting thoughts down with as little friction as possible.
    - title: Exploring a personal knowledge base.
      summary: A direction for connecting captured material, sources, and people.
  home_summary: A personal capture assistant built with self-hosted LLMs, Ollama, and the pi.dev harness.
